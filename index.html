<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:type" content="website">
<meta property="og:title" content="무인매장 점주 매뉴얼">
<meta property="og:description" content="무인매장 점주를 위한 상황별 대처법과 제로아이즈 키오스크 사용법">
<meta property="og:url" content="https://erooming2023-creator.github.io/manual/">
<meta name="robots" content="noindex">
<title>무인매장 점주 매뉴얼</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="무인매장 점주를 위한 상황별 대처법과 제로아이즈 키오스크 사용법">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 사용 기준 단일 칼럼(최대 720px). 상단 고정 검색 → 상황 목록(행) → 상세(핵심 답 · 단계 · 주의 · 연락처) */
:root{
  --bg:#F1F4F0;
  --surface:#FFFFFF;
  --sunk:#E5EAE4;
  --line:#D3DAD2;
  --ink:#15201A;
  --muted:#56645D;
  --accent:#1B6B50;
  --accent-ink:#FFFFFF;
  --accent-soft:#DAECE2;
  --warn:#8A5300;
  --warn-soft:#FAEFD9;
  --kiosk:#1C2621;
  --kiosk-btn:#2B3832;
  --kiosk-ink:#E6EEE9;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1412; --surface:#171F1B; --sunk:#1E2823; --line:#2B3731;
    --ink:#E3EBE6; --muted:#98A79F; --accent:#5BC59D; --accent-ink:#0B1712; --accent-soft:#1B372C;
    --warn:#E9B65A; --warn-soft:#352A15; --kiosk:#0A0F0D; --kiosk-btn:#1E2924; --kiosk-ink:#E6EEE9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171F1B; --sunk:#1E2823; --line:#2B3731;
  --ink:#E3EBE6; --muted:#98A79F; --accent:#5BC59D; --accent-ink:#0B1712; --accent-soft:#1B372C;
  --warn:#E9B65A; --warn-soft:#352A15; --kiosk:#0A0F0D; --kiosk-btn:#1E2924; --kiosk-ink:#E6EEE9;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:48px;padding:0 14px 0 42px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* 목록 */
main.wrap{padding-block:20px 8px}
.intro{color:var(--muted);margin:0 0 16px;max-width:60ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;margin-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2.sec{font-size:20px;line-height:1.35;margin:28px 0 2px;text-wrap:balance}
.sec-note{color:var(--muted);font-size:14px;margin:0 0 6px}
.group-label{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 4px}
.group-label span{font-family:var(--f-mono);font-size:12px}
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.row:hover .row-title{color:var(--accent)}
.row-tag{display:block;font-size:12px;font-weight:600;color:var(--accent)}
.row-title{display:block;font-weight:600;font-size:16px;line-height:1.45;text-wrap:balance}
.row-peek{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:14px;line-height:1.55;margin-top:2px}
.chev{color:var(--muted);font-size:22px;line-height:1}
.notice{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;margin:0 0 16px;font-size:14px}
.empty{padding:12px 0;color:var(--muted)}
.empty p{margin:0 0 6px}
.help{margin-top:32px;padding:16px 18px 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.help h2{font-size:16px;margin:0 0 8px}

/* 상세 */
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;text-decoration:none;color:var(--muted);padding:4px 0}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);margin:10px 0 2px}
.detail h1{font-size:26px;line-height:1.3;margin:0 0 16px;letter-spacing:-.015em;text-wrap:balance}
.answer{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px}
.answer .lbl{display:block;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.answer p{margin:0;font-size:17px;line-height:1.6}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.msg{font-size:13px;color:var(--muted);min-width:0}
.sel{user-select:all;-webkit-user-select:all;font-family:var(--f-mono);color:var(--ink);word-break:break-all}
.blk{margin-top:28px}
.blk h2{font-size:18px;line-height:1.4;margin:0 0 10px}
.blk ul{margin:0;padding-left:1.2em;display:grid;gap:6px}

.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;position:relative;padding-bottom:22px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:36px;bottom:6px;width:2px;background:var(--line)}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--ink);color:var(--bg)}
.step-body{min-width:0;padding-top:3px}
.step-body p{margin:4px 0 0}
.who{display:inline-block;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.who.owner{background:var(--accent);color:var(--accent-ink)}
.pending{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px 2px;margin:10px 0 0;padding:0;list-style:none}
.path li{display:flex;align-items:center;gap:2px}
.path li+li::before{content:"›";color:var(--muted);padding:0 3px}
.path span{font-size:13px;line-height:1.3;padding:5px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.path .key{border-color:var(--accent);color:var(--accent);font-weight:600}
.flow{padding:14px 0;border-top:1px solid var(--line)}
.flow:first-child{border-top:0;padding-top:0}
.flow h3{font-size:16px;margin:0}
.flow .note{color:var(--muted);font-size:14px;margin:6px 0 0}

.kiosk{margin:14px 0 0;width:min(216px,100%)}
.k-screen{background:var(--kiosk);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px}
.k-bar{display:flex;justify-content:space-between;font-size:10px;color:var(--kiosk-ink);opacity:.65;margin:0 2px 8px}
.k-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.k-btn{height:46px;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:600;line-height:1.2;color:var(--kiosk-ink);background:var(--kiosk-btn);border-radius:8px;padding:0 4px}
.k-btn.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 2px var(--kiosk),0 0 0 4px var(--accent);animation:ring 1.8s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 2px var(--kiosk),0 0 0 7px transparent}}
@media (prefers-reduced-motion:reduce){.k-btn.on{animation:none}}
.kiosk figcaption,.shot figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.shot{margin:12px 0 0}
.shot img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
.tbl caption{text-align:left;font-weight:600;padding:12px 14px 8px}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--sunk);font-weight:600;white-space:nowrap}
.tbl td:first-child{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

.cautions{background:var(--warn-soft);border-radius:var(--r);padding:16px 18px}
.cautions h2{color:var(--warn)}

.contacts{border-top:1px solid var(--line)}
.ct{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ct>*{grid-column:1}
.ct-name{font-size:13px;color:var(--muted)}
.ct-val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);text-decoration:none}
.ct-note{font-size:13px;color:var(--muted)}
.ct .open{grid-column:2;grid-row:1 / 4;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.help .contacts .ct:last-child{border-bottom:0}

.meta{margin-top:32px;font-size:13px;color:var(--muted)}
.foot{padding-block:24px 40px;margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.foot p{margin:0 0 6px;max-width:62ch}
</style>
</head>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#" id="home-link">무인매장 점주 매뉴얼<small>제로아이즈 키오스크 기준</small></a>
    <div class="search">

const BASE_TITLE = '무인매장 점주 매뉴얼';
const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg>';

const $view = document.getElementById('view');
const $q = document.getElementById('q');
document.getElementById('foot-date').textContent = '정리 기준일 ' + UPDATED;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const plain = s => String(s || '').replace(/\*\*/g, '');
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
const catLabel = id => (CATEGORIES.find(c => c.id === id) || {}).label || '';
const byId = id => ITEMS.find(i => i.id === id);

ITEMS.forEach(it => {
  it._hay = norm([
    it.title, it.answer, it.keywords, catLabel(it.cat),
    (it.when || []).join(' '), (it.points || []).join(' '), (it.cautions || []).join(' '),
    (it.steps || []).map(s => s.text + ' ' + (s.path || []).join(' ')).join(' '),
    (it.flows || []).map(f => f.title + ' ' + (f.path || []).join(' ') + ' ' + (f.note || '')).join(' ')
  ].join(' '));
});

const state = { q: '', cat: 'all' };

function pathHTML(path) {
  return '<ol class="path">' + path.map((p, i) =>
    '<li><span' + (i === 0 && KIOSK_MENU.includes(p) ? ' class="key"' : '') + '>' + esc(p) + '</span></li>'
  ).join('') + '</ol>';
}

function kioskHTML(on) {
  const label = on ? '키오스크 예시 화면, ' + on + ' 버튼 위치' : '키오스크 메인 화면 예시';
  return '<figure class="kiosk" role="img" aria-label="' + esc(label) + '"><div class="k-screen">' +
    '<div class="k-bar"><span>메인 화면</span><span>로그인 전</span></div><div class="k-grid">' +
    KIOSK_MENU.map(m => '<div class="k-btn' + (m === on ? ' on' : '') + '">' + esc(m) + '</div>').join('') +
    '</div></div><figcaption>예시 화면 · 매장마다 실제 화면이 다를 수 있어요</figcaption></figure>';
}

function rowHTML(it, showTag) {
  return '<li><a class="row" href="#' + esc(it.id) + '"><span>' +
    (showTag ? '<span class="row-tag">' + esc(catLabel(it.cat)) + '</span>' : '') +
    '<span class="row-title">' + esc(it.title) + '</span>' +
    '<span class="row-peek">' + esc(plain(it.answer)) + '</span></span>' +
    '<span class="chev" aria-hidden="true">›</span></a></li>';
}

function contactsHTML(keys) {
  return '<div class="contacts">' + keys.map(k => {
    const c = CONTACTS[k];
    if (!c) return '';
    const val = c.tel
      ? '<a class="ct-val" href="tel:' + esc(c.tel) + '">' + esc(c.value) + '</a>'
      : '<span class="ct-val">' + esc(c.value) + '</span>';
    return '<div class="ct"><span class="ct-name">' + esc(c.name) + '</span>' + val +
      (c.note ? '<span class="ct-note">' + esc(c.note) + '</span>' : '') +
      (c.url ? '<a class="open" href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.link || '열기') + ' ↗</a>' : '') +
      '</div>';
  }).join('') + '</div>';
}

function tableHTML(t) {
  return '<div class="tbl"><table>' + (t.caption ? '<caption>' + esc(t.caption) + '</caption>' : '') +
    '<thead><tr>' + t.head.map(h => '<th scope="col">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    t.rows.map(r => '<tr>' + r.map(c => '<td>' + md(c) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

const blk = (title, inner, cls) => '<section class="blk' + (cls ? ' ' + cls : '') + '">' + (title ? '<h2>' + esc(title) + '</h2>' : '') + inner + '</section>';

function chipsHTML() {
  const all = [{ id: 'all', label: '전체' }].concat(CATEGORIES);
  return '<div class="chips" role="group" aria-label="분류로 보기">' + all.map(c =>
    '<button type="button" class="chip" data-cat="' + c.id + '" aria-pressed="' + (state.cat === c.id) + '">' + esc(c.label) + '</button>'
  ).join('') + '</div>';
}

function renderHome(missingId) {
  document.title = BASE_TITLE;
  const qn = norm(state.q);
  const filtering = !!qn || state.cat !== 'all';
  let h = '';
  if (missingId) h += '<p class="notice">찾는 안내(#' + esc(missingId) + ')가 없어요. 아래 목록에서 골라 주세요.</p>';
  if (!filtering) h += '<p class="intro">매장에서 자주 생기는 상황과 키오스크 사용법을 모았습니다. 항목을 누르면 단계별 안내가 나오고, 링크를 복사해 바로 보낼 수 있어요.</p>';
  h += chipsHTML();

  if (filtering) {
    const list = ITEMS.filter(it => (state.cat === 'all' || it.cat === state.cat) && (!qn || it._hay.includes(qn)));
    h += '<p class="sec-note" role="status">' + (list.length ? list.length + '개 찾았어요' : '') + '</p>';
    if (!list.length) {
      h += '<div class="empty"><p>‘' + esc(state.q) + '’에 맞는 안내가 아직 없어요.</p><p>다른 말로 찾아보거나 고객센터에 문의하세요.</p></div>' + contactsHTML(['kakao', 'ars']);
    } else {
      h += '<ul class="rows">' + list.map(it => rowHTML(it, true)).join('') + '</ul>';
    }
  } else {
    const cases = ITEMS.filter(i => i.type === 'case');
    h += '<h2 class="sec">상황별 대처</h2><p class="sec-note">고객 문의가 오면 여기서 찾으세요 · ' + cases.length + '개</p>';
    CATEGORIES.forEach(c => {
      const list = cases.filter(i => i.cat === c.id);
      if (!list.length) return;
      h += '<h3 class="group-label">' + esc(c.label) + ' <span>' + list.length + '</span></h3><ul class="rows">' + list.map(i => rowHTML(i, false)).join('') + '</ul>';
    });
    const guides = ITEMS.filter(i => i.type === 'guide');
    h += '<h2 class="sec">키오스크 사용법</h2><p class="sec-note">고객에게 순서를 안내할 때 보세요</p><ul class="rows">' + guides.map(i => rowHTML(i, false)).join('') + '</ul>';
    const infos = ITEMS.filter(i => i.type === 'info');
    h += '<h2 class="sec">운영 기본 정보</h2><ul class="rows">' + infos.map(i => rowHTML(i, false)).join('') + '</ul>';
    h += '<section class="help"><h2>급할 때 연락처</h2>' + contactsHTML(['as', 'ars', 'kakao']) + '</section>';
  }
  $view.innerHTML = h;
}

function renderDetail(it) {
  document.title = it.title + ' | ' + BASE_TITLE;
  let h = '<article class="detail"><a class="back" href="#">‹ 전체 목록</a>' +
    '<p class="eyebrow">' + esc(catLabel(it.cat)) + '</p><h1>' + esc(it.title) + '</h1>' +
    '<div class="answer"><span class="lbl">' + (it.type === 'case' ? '핵심 답변' : '요약') + '</span><p>' + md(it.answer) + '</p></div>' +
    '<div class="share"><button type="button" class="btn" data-copy="' + esc(it.id) + '">' + ICON_LINK + '이 안내 링크 복사</button><span class="msg" id="copy-msg" role="status"></span></div>';

  if (it.when && it.when.length) h += blk('이럴 때 해당돼요', '<ul>' + it.when.map(w => '<li>' + md(w) + '</li>').join('') + '</ul>');
  if (it.figure) h += blk('', kioskHTML(''));

  if (it.steps && it.steps.length) {
    h += blk(it.type === 'case' ? '이렇게 하세요' : '순서', '<ol class="steps">' + it.steps.map((s, i) =>
      '<li class="step"><span class="num" aria-hidden="true">' + (i + 1) + '</span><div class="step-body">' +
      (s.who ? '<span class="who' + (s.who === '점주' ? ' owner' : '') + '">' + esc(s.who) + '</span>' : '') +
      '<p>' + md(s.text) + '</p>' +
      (s.path ? pathHTML(s.path) : '') +
      (s.pending ? '<span class="pending">' + esc(s.pending) + '</span>' : '') +
      (s.img ? '<figure class="shot"><img src="' + esc(s.img) + '" alt="' + esc(s.alt || plain(s.text)) + '" loading="lazy">' + (s.caption ? '<figcaption>' + esc(s.caption) + '</figcaption>' : '') + '</figure>'
             : (s.screen ? kioskHTML(s.screen) : '')) +
      '</div></li>'
    ).join('') + '</ol>');
  }

  if (it.flows && it.flows.length) {
    h += blk('메뉴 순서', it.flows.map(f =>
      '<div class="flow"><h3>' + esc(f.title) + '</h3>' + pathHTML(f.path) + (f.note ? '<p class="note">' + md(f.note) + '</p>' : '') + '</div>'
    ).join(''));
  }

  if (it.points && it.points.length) h += blk(it.pointsTitle || '알아두세요', '<ul>' + it.points.map(p => '<li>' + md(p) + '</li>').join('') + '</ul>');
  if (it.table) h += blk('', tableHTML(it.table));
  if (it.cautions && it.cautions.length) h += blk('주의하세요', '<ul>' + it.cautions.map(c => '<li>' + md(c) + '</li>').join('') + '</ul>', 'cautions');
  if (it.contacts && it.contacts.length) h += blk(it.contactsTitle || '해결이 안 되면', contactsHTML(it.contacts));

  const rel = (it.related || []).map(byId).filter(Boolean);
  if (rel.length) h += blk('함께 보면 좋은 안내', '<ul class="rows">' + rel.map(r => rowHTML(r, true)).join('') + '</ul>');

  const src = SOURCES[it.source] || SOURCES.kiosk;
  h += '<p class="meta">근거 자료: <a href="' + esc(src.url) + '" target="_blank" rel="noopener">' + esc(src.label) + ' ↗</a><br>마지막 업데이트 ' + esc(it.updated || UPDATED) + '</p></article>';
  $view.innerHTML = h;
}

function route() {
  let id = '';
  try { id = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { id = ''; }
  const it = id ? byId(id) : null;
  if (it) renderDetail(it); else renderHome(id || null);
  window.scrollTo(0, 0);
}

function shareUrl(id) {
  if (SITE_URL) return SITE_URL.replace(/#.*$/, '') + '#' + id;
  let framed = true;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  return framed ? '' : location.href.split('#')[0] + '#' + id;
}

document.addEventListener('click', e => {
  const chip = e.target.closest('[data-cat]');
  if (chip) { state.cat = chip.dataset.cat; renderHome(); return; }

  if (e.target.closest('#home-link')) { state.q = ''; state.cat = 'all'; $q.value = ''; if (!location.hash || location.hash === '#') { e.preventDefault(); renderHome(); window.scrollTo(0, 0); } return; }

  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const id = b.dataset.copy;
  const msg = document.getElementById('copy-msg');
  const url = shareUrl(id);
  if (!url) { msg.textContent = '주소창의 링크(끝이 #' + id + ')를 복사해 보내세요.'; return; }
  const fail = () => { msg.innerHTML = '자동 복사가 막혀 있어요. 이 주소를 길게 눌러 복사하세요: <span class="sel">' + esc(url) + '</span>'; };
  try {
    navigator.clipboard.writeText(url).then(() => { msg.textContent = '링크를 복사했어요. 카톡에 붙여 넣어 보내세요.'; }, fail);
  } catch (err) { fail(); }
});

$q.addEventListener('input', () => {
  state.q = $q.value.trim();
  if (location.hash && location.hash !== '#') location.hash = '';
  else renderHome();
});

window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
